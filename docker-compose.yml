services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ecosync
      POSTGRES_PASSWORD: ecosync_dev
      POSTGRES_DB: ecosync
    ports:
      - '5432:5432'
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecosync -d ecosync']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dados_postgres:
